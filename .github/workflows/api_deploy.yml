name: Deploy API

on:
  push:
    branches:
      - api        # Only triggers on the "api" branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        run: |
          PAYLOAD='{"event":"deploy"}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')
          curl -f -X POST http://deploy.onyx.14082006.xyz/deploy \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $SIGNATURE" \
            -d "$PAYLOAD"

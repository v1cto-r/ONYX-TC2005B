name: Deploy API

on:
  push:
    branches:
      - api        # Only triggers on the "api" branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        run: |
          PAYLOAD='{"event":"deploy"}'
          curl -f -X POST https://deploy.onyx.14082006.xyz/deploy \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "$PAYLOAD"

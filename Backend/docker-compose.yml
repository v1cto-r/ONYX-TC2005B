networks:
  app_network:
    driver: bridge

services:
  api_gio:
    restart: always
    env_file:
      - .env
    build:
      context: ./gio
      dockerfile: Dockerfile
    ports:
      - "12001:12001"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:12001/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  api_victor:
    restart: always
    env_file:
      - .env
    build:
      context: ./victor
      dockerfile: Dockerfile
    ports:
      - "12002:12002"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:12002/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  api_marino:
    restart: always
    env_file:
      - .env
    build:
      context: ./marino
      dockerfile: Dockerfile
    ports:
      - "12003:12003"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:12003/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  api_jorge:
    restart: always
    env_file:
      - .env
    build:
      context: ./jorge
      dockerfile: Dockerfile
    ports:
      - "12004:12004"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:12004/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  api_nicte:
    restart: always
    env_file:
      - .env
    build:
      context: ./nicte
      dockerfile: Dockerfile
    ports:
      - "12005:12005"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:12005/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app_network
    depends_on:
      - api_gio
      - api_victor
      - api_marino
      - api_jorge
      - api_nicte

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"